# Gera o site a cada envio para a main e publica no ramo gh-pages (GitHub Pages).
# Refaz o corpus a partir das fontes abertas; as glosas saem iguais às do repositório porque o alinhamento
# fica salvo em data/alignment. Os vídeos "Como usar" já publicados em gh-pages/videos são mantidos.
# Quando termina, dispara o app Android e a gravação dos vídeos (workflow_dispatch), que usam este site.
name: Site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Fontes abertas
        run: scripts/download_sources.sh
      - name: Corpus, glosas, revisão e site
        run: |
          python3 scripts/corpus.py
          python3 scripts/make_glosses.py
          python3 scripts/review.py > /dev/null
          npm run build:web
      - name: Ramo gh-pages
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: gh-pages
          path: gh-pages
      - name: Publicar (mantendo os vídeos)
        run: |
          find gh-pages -mindepth 1 -maxdepth 1 ! -name .git ! -name videos -exec rm -rf {} +
          rm -rf build/web/videos
          cp -r build/web/. gh-pages/
          cp LICENSE gh-pages/
          touch gh-pages/.nojekyll
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nada mudou no site."; exit 0; }
          # um commit só, sem histórico: o ramo não cresce a cada publicação; o lease recusa o envio se os
          # Vídeos publicaram no meio
          BASE="$(git rev-parse HEAD)"
          NEW="$(git commit-tree "$(git write-tree)" -m "Site: ${GITHUB_SHA::7} ($(git -C .. log -1 --format=%s | cut -c1-60))")"
          git push --force-with-lease=gh-pages:"$BASE" origin "$NEW":refs/heads/gh-pages
      - name: Pedir ao GitHub Pages que publique (envios do github-actions[bot] não disparam a publicação)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "::warning::Não foi possível pedir a publicação do GitHub Pages"
      - name: Disparar Android e Vídeos (usam o site publicado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android.yml --ref main
          gh workflow run videos.yml --ref main
