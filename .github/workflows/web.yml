# Reconstrói tudo do zero (fontes, corpus, glosas) e publica a versão web no GitHub Pages.
# Só roda quando chamado à mão (Actions › Web › Run workflow) e com Settings › Pages › Source: GitHub Actions.
# A publicação padrão é o ramo gh-pages, gerado localmente por scripts/publicar_web.sh (mesmas glosas revisadas).
# A política de privacidade fica em <endereço do site>/privacidade.html (a Play Store pede esse link).
name: Web
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install eflomal
      - run: npm ci
      - run: PDF=0 scripts/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: saida/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
