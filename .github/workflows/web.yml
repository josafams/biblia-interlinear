# Reconstrói tudo do zero (fontes, corpus, glosas) e publica a versão web no GitHub Pages.
# Só roda quando chamado à mão (Actions › Web › Run workflow) e com Settings › Pages › Source: GitHub Actions.
# A publicação padrão é o ramo gh-pages, gerado localmente por scripts/publish_web.sh (mesmas glosas revisadas).
# A política de privacidade fica em <endereço do site>/privacidade.html (a Play Store pede esse link).
name: Web
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install eflomal
      - run: npm ci
      - run: PDF=0 scripts/build.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
