# Verifica se o projeto iOS compila (simulador, sem assinatura). Roda só manualmente,
# porque usa máquina macOS. Para publicar na App Store é preciso uma conta Apple
# Developer e assinar pelo Xcode ou com as chaves cadastradas aqui.
name: iOS (verificação)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - name: Site já gerado (ramo gh-pages) como conteúdo do app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: gh-pages
          path: build/web
      # the static pages for search engines (biblia/, lexico/, sitemaps) are for the web only
      - run: rm -rf build/web/.git build/web/biblia build/web/lexico build/web/en/bible build/web/en/lexicon build/web/sitemap*.xml build/web/robots.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilar para o simulador
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
