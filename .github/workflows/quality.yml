# Formatação e lint de todas as linguagens, em todo pull request e envio à main (rápido: ~1 min).
# Os mesmos comandos de `make lint` e do pre-commit.
name: Qualidade
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: npm ci
      - run: pip install -r requirements-dev.txt shellcheck-py
      - name: Prettier (JS, JSON, YAML, CSS)
        run: npx prettier --check .
      - name: ESLint
        run: npx eslint . --max-warnings 5
      - name: Ruff (lint e formatação do Python)
        run: |
          ruff check .
          ruff format --check .
      - name: Markdown
        run: npx markdownlint-cli2 "**/*.md"
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Dados editados à mão
        run: python3 scripts/check_data.py
      - name: Links internos da documentação
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path node_modules --exclude-path build/ "**/*.md"
          fail: true
