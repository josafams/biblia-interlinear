# Formatação e lint de todas as linguagens, em todo pull request e envio à main (rápido: ~1 min).
# Os mesmos comandos de `make lint` e do pre-commit.
name: Qualidade
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: npm ci
      - run: pip install -r requirements-dev.txt shellcheck-py
      - name: Prettier (JS, JSON, YAML, CSS)
        run: npx prettier --check .
      - name: ESLint
        run: npx eslint . --max-warnings 5
      - name: Stylelint (colors only in tokens.css)
        run: npx stylelint "src/styles/*.css"
      - name: TypeScript (type check)
        run: npm run check
      - name: i18n (screen text only in the locale)
        run: node scripts/dev/i18n_check.mjs
      - name: Unit tests (Vitest)
        run: npx vitest run
      - name: Ruff (lint e formatação do Python)
        run: |
          ruff check .
          ruff format --check .
      - name: mypy (tipos do Python)
        run: mypy
      - name: Markdown
        run: npx markdownlint-cli2 "**/*.md"
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Dados editados à mão
        run: python3 scripts/check_data.py
      - name: Links internos da documentação
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path node_modules --exclude-path build/ "**/*.md"
          fail: true
