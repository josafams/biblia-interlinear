# Gera os livros para baixar e publica na página Releases (release "livros", sempre a última versão):
#   - EPUB da Bíblia completa, do Antigo e do Novo Testamento e de cada um dos 66 livros
#   - PDF (A4) de cada um dos 66 livros
# Roda quando dados/ ou os scripts mudam na main (por exemplo, depois de um pull request de correções) e manualmente.
# Refaz o corpus a partir das fontes abertas; as glosas saem iguais às do repositório porque o alinhamento fica
# salvo em dados/alinhamento (só é refeito se o texto de alguma fonte mudar).
name: Livros (EPUB e PDF)
on:
  push:
    branches: [main]
    paths: ["dados/**", "scripts/**", "fontes-epub/**", ".github/workflows/livros.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: livros
  cancel-in-progress: true

jobs:
  livros:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install eflomal
      - run: npm ci
      - name: Chromium para os PDFs
        run: npx playwright install --with-deps chromium
      - name: Fontes abertas
        run: scripts/baixar_fontes.sh
      - name: Corpus e glosas
        run: |
          python3 scripts/corpus.py
          python3 scripts/glosar.py
          python3 scripts/revisar.py > /dev/null
          python3 scripts/exportar.py
      - name: EPUB (Bíblia completa, AT, NT e 66 livros)
        run: python3 scripts/build_epub.py
      - name: PDF (66 livros)
        run: python3 scripts/build_pdf.py
      - name: Publicar na página Releases (livros)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(date +%d/%m/%Y)
          NOTAS="Bíblia Interlinear (BLIVRE) para baixar — gerada em ${DATA} a partir do commit ${GITHUB_SHA::7}.

          **EPUB** (Kindle e outros leitores; cada palavra do original é uma nota com glosa, gramática e significado):
          - 00-Biblia-Interlinear-completa.epub — os 66 livros num arquivo só
          - 00-Biblia-Interlinear-AT.epub e 00-Biblia-Interlinear-NT.epub — por testamento (abrem mais rápido)
          - um EPUB por livro (01-GEN-Genesis.epub … 66-REV-Apocalipse.epub)

          **PDF** (A4): um por livro, com os cartões das palavras e a BLIVRE abaixo de cada versículo.

          No Kindle: envie o EPUB pelo Send to Kindle (até 200 MB pelo app ou site; por e-mail, até 50 MB)."
          if gh release view livros >/dev/null 2>&1; then
            gh release view livros --json assets -q '.assets[].name' | while read -r a; do gh release delete-asset livros "$a" -y; done
            gh release edit livros --title "Livros: EPUB e PDF (${DATA})" --notes "$NOTAS" --target main
            git push --force origin "HEAD:refs/tags/livros"
          else
            gh release create livros --title "Livros: EPUB e PDF (${DATA})" --notes "$NOTAS" --target main
          fi
          gh release upload livros saida/epub/*.epub saida/pdf/*.pdf --clobber
