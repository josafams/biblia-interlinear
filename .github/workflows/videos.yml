# Grava de novo os vídeos "Como usar" (scripts/videos/roteiros.mjs) a partir do site publicado
# e publica em gh-pages/videos. Roda depois que o workflow Site publica o site, e à mão.
# Se um roteiro não consegue completar os passos, o workflow falha: a tela mudou e o roteiro precisa acompanhar.
name: Vídeos
on:
  workflow_dispatch: # disparado pelo workflow Site depois de publicar, ou à mão

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages-videos
  cancel-in-progress: true

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Site publicado (gh-pages) em build/web
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: gh-pages
          path: build/web
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium e ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Gravar
        run: node scripts/videos/gravar.mjs
      - name: Gravar em inglês (o app com ?lang=en, em build/videos/en)
        run: node scripts/videos/gravar.mjs --lang en
      - name: Publicar em gh-pages
        run: |
          rm -rf build/web/videos
          mkdir -p build/web/videos
          cp build/videos/*.mp4 build/videos/*.vtt build/videos/*.jpg build/videos/videos.js build/web/videos/
          mkdir -p build/web/videos/en
          cp build/videos/en/*.mp4 build/videos/en/*.vtt build/videos/en/*.jpg build/videos/en/videos.js build/web/videos/en/
          cd build/web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A videos
          if git diff --cached --quiet && ! git cat-file -p HEAD | grep -q "^parent "; then echo "Nada mudou."; exit 0; fi
          # um commit só, sem histórico (como no workflow Site); o lease recusa o envio se o Site publicou no meio
          BASE="$(git rev-parse HEAD)"
          NEW="$(git commit-tree "$(git write-tree)" -m "Vídeos Como usar: gravados de novo (${GITHUB_SHA::7})")"
          git push --force-with-lease=gh-pages:"$BASE" origin "$NEW":refs/heads/gh-pages
      - name: Pedir ao GitHub Pages que publique (envios do github-actions[bot] não disparam a publicação)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "::warning::Não foi possível pedir a publicação do GitHub Pages"
