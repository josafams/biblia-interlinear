# Grava de novo os vídeos "Como usar" (scripts/videos/roteiros.mjs) a partir do site publicado
# e publica em gh-pages/videos. Roda depois que o workflow Site publica o site, e à mão.
# Se um roteiro não consegue completar os passos, o workflow falha: a tela mudou e o roteiro precisa acompanhar.
name: Vídeos
on:
  workflow_dispatch: # disparado pelo workflow Site depois de publicar, ou à mão

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages-videos
  cancel-in-progress: true

jobs:
  # as duas línguas gravam ao mesmo tempo, cada uma na sua máquina; a publicação junta as duas
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        lang: [pt, en]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Site publicado (gh-pages) em build/web
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: gh-pages
          path: build/web
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium e ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Gravar (${{ matrix.lang }}; em inglês, o app com ?lang=en, em build/videos/en)
        run: node scripts/videos/gravar.mjs --lang ${{ matrix.lang }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: videos-${{ matrix.lang }}
          # the folder itself, so the English ones keep their en/ (build/videos/en)
          path: build/videos
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Site publicado (gh-pages) em build/web
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: gh-pages
          path: build/web
      - name: Os vídeos das duas línguas
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: videos-*
          path: build/videos
          merge-multiple: true
      - name: Publicar em gh-pages
        run: |
          ls build/videos build/videos/en
          rm -rf build/web/videos
          cp -r build/videos build/web/videos
          cd build/web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A videos
          if git diff --cached --quiet && ! git cat-file -p HEAD | grep -q "^parent "; then echo "Nada mudou."; exit 0; fi
          # um commit só, sem histórico (como no workflow Site); o lease recusa o envio se o Site publicou no meio
          BASE="$(git rev-parse HEAD)"
          NEW="$(git commit-tree "$(git write-tree)" -m "Vídeos Como usar: gravados de novo (${GITHUB_SHA::7})")"
          git push --force-with-lease=gh-pages:"$BASE" origin "$NEW":refs/heads/gh-pages
      - name: Pedir ao GitHub Pages que publique (envios do github-actions[bot] não disparam a publicação)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "::warning::Não foi possível pedir a publicação do GitHub Pages"
