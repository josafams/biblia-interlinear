# Confere os arquivos de dados (temas, introduções, léxico, correções) em cada pull request e envio.
# Rápido (segundos): não baixa as fontes nem refaz as glosas.
name: Verificar dados
on:
  pull_request:
  push:
    branches: [main]
    paths: ["data/**", "scripts/check_data.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python3 scripts/check_data.py
