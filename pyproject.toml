# Configuração das ferramentas de Python (os scripts ficam em scripts/; não é um pacote publicado)
[project]
name = "biblia-interlinear"
version = "0.1.0"
requires-python = ">=3.11"
license = "CC-BY-SA-4.0"

[tool.ruff]
line-length = 140
target-version = "py311"  # the Docker image runs Debian's 3.11; CI runs 3.12
src = ["scripts", "tests"]
extend-exclude = ["node_modules", "build", "sources", "android", "ios"]

[tool.ruff.lint]
# E/F: erros básicos, I: imports, B: bugs comuns, UP: sintaxe moderna, S: segurança,
# SIM: simplificações, PT: estilo pytest, C90: complexidade
select = ["E", "F", "I", "B", "UP", "S", "SIM", "PT", "C90"]
ignore = [
  "E501",   # linhas longas: o formatador cuida do que dá; tabelas de dados ficam numa linha
  "S603", "S607",   # subprocess com lista de argumentos e programas do sistema (qpdf, eflomal): uso intencional
  "SIM108", # ternário nem sempre é mais claro
  "SIM102", # ifs aninhados: em review.py cada nível é uma condição de uma regra do catálogo, com comentário
  "B023",   # funções definidas dentro de laços são chamadas na mesma volta do laço (glosas, marcadores do PDF)
]

[tool.ruff.lint.mccabe]
max-complexity = 40   # piso atual (export.main, review.check_versification); baixar aos poucos nas refatorações

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert é permitido nos testes

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Every script is checked; the functions without annotations are typed module by module, and the modules already
# typed in full (the core of scripts/interlinear) are checked strictly.
python_version = "3.11"
mypy_path = "scripts"
files = ["scripts"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
cache_dir = "build/.mypy_cache"

[[tool.mypy.overrides]]
module = [
  "interlinear.books",
  "interlinear.cli",
  "interlinear.models",
  "interlinear.paths",
  "interlinear.rules",
  "interlinear.sources",
  "interlinear.text",
  "interlinear.tsv",
]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["lento: gera EPUB/PDF ou roda ferramentas externas"]

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
